<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entra ID Passkey Decision Flow | Azure Brother</title>
    <meta name="description" content="Interactive decision tree to help you choose the correct Microsoft Entra ID passkey option based on OS, hardware, and policy constraints. By Azure Brother.">
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        azureDark: '#0b1120',
                        azurePanel: '#1e293b',
                        azureBlue: '#0ea5e9',
                        azureHover: '#0284c7',
                        azureAccent: '#38bdf8'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b1120;
            color: #f8fafc;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Branding Header -->
    <header class="text-center mb-8 fade-in">
        <h1 class="text-4xl md:text-5xl font-extrabold text-white tracking-tight mb-2">
            Azure<span class="text-azureBlue">Brother</span>
        </h1>
        <p class="text-azureAccent uppercase tracking-widest text-sm font-semibold">
            Cloud. Identity. Security.
        </p>
    </header>

    <!-- App Container -->
    <main class="w-full max-w-2xl bg-azurePanel rounded-2xl shadow-2xl border border-slate-700 overflow-hidden flex flex-col fade-in">
        <!-- Progress Bar -->
        <div class="w-full bg-slate-800 h-2">
            <div id="progress-bar" class="bg-azureBlue h-2 transition-all duration-300" style="width: 25%"></div>
        </div>
        
        <!-- Interactive Content -->
        <div class="p-6 md:p-8 flex-grow min-h-[350px] flex flex-col justify-center" id="content-container">
            <!-- Dynamic Content injected via JS -->
        </div>

        <!-- Footer Navigation -->
        <div class="bg-slate-800/50 p-4 px-6 md:px-8 border-t border-slate-700 flex justify-between items-center">
            <button id="btn-back" class="text-slate-400 hover:text-white font-medium px-4 py-2 rounded transition-colors hidden" onclick="goBack()">
                &larr; Back
            </button>
            <button class="text-azureBlue hover:text-azureAccent font-medium px-4 py-2 rounded transition-colors ml-auto flex items-center gap-2" onclick="startAgain()">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Start Again
            </button>
        </div>
    </main>

    <script>
        const flow = {
            start: {
                question: "How are you trying to configure or use your Passkey?",
                depth: 1,
                options: [
                    { text: "On a Windows Device", next: "windows_path" },
                    { text: "On a macOS Device", next: "macos_path" },
                    { text: "Using a mobile phone / Microsoft Authenticator", next: "auth_path" }
                ]
            },
            windows_path: {
                question: "What type of Windows device is this?",
                depth: 2,
                options: [
                    { text: "Company-managed device (Corporate)", next: "windows_managed" },
                    { text: "BYOD or Consultant device (Unmanaged)", next: "windows_byod" }
                ]
            },
            windows_managed: {
                type: "result",
                status: "success",
                title: "✅ Use Windows Hello for Business (WHfB)",
                details: "For managed Windows devices, Windows Hello for Business (WHfB) acts as a strong, device-bound passkey backed by the device's TPM. This is Microsoft's recommended native integration for corporate identities."
            },
            windows_byod: {
                type: "result",
                status: "success",
                title: "✅ Save Passkey to Windows Device (FIDO2)",
                details: "For BYOD or consultants, Entra ID allows saving a FIDO2 passkey directly to Windows Hello. This registers a device-bound passkey isolated to that specific local device without requiring full MDM enrollment."
            },
            macos_path: {
                type: "result",
                status: "success",
                title: "✅ Use Platform SSO for macOS",
                details: "On macOS 13 or later, Platform SSO (with Secure Enclave) enables hardware-bound passkeys native to Apple devices, providing a seamless, phishing-resistant Entra ID sign-in experience."
            },
            auth_path: {
                question: "Do you have a physical FIDO2 security key (e.g., YubiKey)?",
                depth: 2,
                options: [
                    { text: "Yes, I have a hardware security key", next: "fido2_key" },
                    { text: "No, I am prompted to use my phone", next: "phone_os" }
                ]
            },
            fido2_key: {
                type: "result",
                status: "success",
                title: "✅ Register a FIDO2 Security Key",
                details: "A physical FIDO2 security key is a true device-bound passkey offering the highest level of phishing resistance. It completely bypasses mobile OS version limitations."
            },
            phone_os: {
                question: "Does your mobile device meet the minimum OS requirements for Authenticator Passkeys?",
                depth: 3,
                infoHtml: `Microsoft Authenticator passkeys require <strong>Android 14+</strong> or <strong>iOS 17+</strong>, and minimum app versions (iOS 6.8.37+ / Android 6.2507+). <br><a href="https://learn.microsoft.com/en-us/entra/identity/authentication/how-to-enable-authenticator-passkey" target="_blank" class="text-azureBlue hover:text-azureAccent underline mt-2 inline-block text-sm">View Official Documentation</a>`,
                options: [
                    { text: "Yes (Android 14+ / iOS 17+)", next: "auth_passkey" },
                    { text: "No (Older Android/iOS version)", next: "synced_check" }
                ]
            },
            auth_passkey: {
                type: "result",
                status: "success",
                title: "✅ Use Microsoft Authenticator Passkey",
                details: "Your OS is supported! You can register a highly secure, device-bound passkey directly inside the Microsoft Authenticator app."
            },
            synced_check: {
                question: "Does your organization allow 'Synced Passkeys'?",
                depth: 4,
                infoHtml: `<strong>Device-Bound</strong> passkeys (like MS Authenticator) never leave the physical device. <strong>Synced Passkeys</strong> backup to the cloud (e.g., Google Password Manager, iCloud). Many high-security environments block synced passkeys via Entra Attestation policies. <br><a href="https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-passkeys#device-bound-and-synced-passkeys" target="_blank" class="text-azureBlue hover:text-azureAccent underline mt-2 inline-block text-sm">Learn about Device-bound vs Synced Passkeys</a>`,
                options: [
                    { text: "Yes, synced passkeys are allowed", next: "synced_passkey_result" },
                    { text: "No, synced passkeys are prohibited", next: "no_option" }
                ]
            },
            synced_passkey_result: {
                type: "result",
                status: "warning",
                title: "⚠️ Use a Synced Passkey",
                details: "Since your OS is too old for the Authenticator device-bound passkey, but your organization allows Synced Passkeys, you can save the credential to your native Google Password Manager (Android) or iCloud Keychain (iOS)."
            },
            no_option: {
                type: "result",
                status: "error",
                title: "❌ No suitable passkey option",
                details: "<p class='mb-3'>Based on your scenario, you are currently blocked from registering a passkey because:</p><ul class='list-disc ml-5 mb-4 space-y-1 text-slate-300'><li>You don't have a physical FIDO2 key.</li><li>Your Android/iOS version is too old for Microsoft Authenticator passkeys (Android 14+ / iOS 17+ required).</li><li>Your organization's security policy prohibits Synced Passkeys.</li></ul><p><strong>Resolution:</strong> You must upgrade your mobile device OS, acquire a physical FIDO2 security key, or contact your IT admin for a fallback authentication method (such as a Temporary Access Pass).</p>"
            }
        };

        const maxDepth = 4;
        let historyStack = [];
        let currentNodeKey = 'start';

        const container = document.getElementById('content-container');
        const btnBack = document.getElementById('btn-back');
        const progressBar = document.getElementById('progress-bar');

        function renderNode(nodeKey) {
            const node = flow[nodeKey];
            container.innerHTML = '';
            
            // Calculate and update progress bar
            const currentDepth = node.depth || (historyStack.length + 1);
            const percentage = Math.min((currentDepth / maxDepth) * 100, 100);
            progressBar.style.width = `${percentage}%`;

            // Update Back button visibility
            if (historyStack.length > 0) {
                btnBack.classList.remove('hidden');
            } else {
                btnBack.classList.add('hidden');
            }

            const wrapper = document.createElement('div');
            wrapper.className = 'fade-in flex flex-col h-full justify-center';

            if (node.type === 'result') {
                progressBar.style.width = '100%';
                
                let iconColor = 'text-green-500';
                let bgBorder = 'border-green-500/30 bg-green-500/10';
                if (node.status === 'warning') {
                    iconColor = 'text-yellow-400';
                    bgBorder = 'border-yellow-400/30 bg-yellow-400/10';
                } else if (node.status === 'error') {
                    iconColor = 'text-red-400';
                    bgBorder = 'border-red-500/30 bg-red-500/10';
                }

                wrapper.innerHTML = `
                    <div class="p-6 md:p-8 rounded-xl border ${bgBorder} text-center shadow-lg">
                        <h2 class="text-2xl font-bold text-white mb-4 ${iconColor}">${node.title}</h2>
                        <div class="text-slate-300 text-left text-base md:text-lg leading-relaxed">${node.details}</div>
                    </div>
                `;
            } else {
                let html = `<h2 class="text-xl md:text-2xl font-semibold text-white mb-6 text-center leading-snug">${node.question}</h2>`;
                
                if (node.infoHtml) {
                    html += `
                        <div class="mb-6 p-4 bg-slate-800/80 border-l-4 border-azureBlue text-slate-300 text-sm rounded-r-lg shadow-inner">
                            ${node.infoHtml}
                        </div>
                    `;
                }

                html += `<div class="space-y-3 mt-auto">`;
                
                node.options.forEach(opt => {
                    html += `
                        <button onclick="navigate('${opt.next}')" 
                                class="w-full text-left px-6 py-4 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-azureBlue transition-all duration-200 group flex items-center justify-between shadow-sm">
                            <span class="text-white font-medium group-hover:text-azureBlue transition-colors">${opt.text}</span>
                            <span class="text-slate-500 group-hover:text-azureBlue transition-colors text-xl">&rarr;</span>
                        </button>
                    `;
                });
                
                html += `</div>`;
                wrapper.innerHTML = html;
            }

            container.appendChild(wrapper);
        }

        function navigate(nextNodeKey) {
            historyStack.push(currentNodeKey);
            currentNodeKey = nextNodeKey;
            renderNode(currentNodeKey);
        }

        function goBack() {
            if (historyStack.length > 0) {
                currentNodeKey = historyStack.pop();
                renderNode(currentNodeKey);
            }
        }

        function startAgain() {
            historyStack = [];
            currentNodeKey = 'start';
            renderNode('start');
        }

        // Initialize the first view
        renderNode('start');
    </script>
</body>
</html>
